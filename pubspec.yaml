name: xlift_vision_pose
description: Apple Vision 3D body pose bridge for Xlift (experiment).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: XliftVisionPosePlugin
